# Publishes a folder of this repository to GitHub Pages, on every push to main.
#
# PUBLISH_DIR below decides WHAT goes online, and it is the only switch:
#
#   soon   the holding page alone (what is online today). The real pages stay
#          in this repository and never reach the server, so no URL can reach
#          them: there is nothing to guess.
#   site   the whole site: protocol, wallet, documentation, IT and EN.
#
# To open the site, set PUBLISH_DIR to `site` and push. To close it again, set
# it back to `soon`. There is no build step either way: the folder is plain
# HTML, CSS, JS, fonts and images, uploaded as it is. The custom domain lives
# in the repository's Pages settings (and in a CNAME file in both folders);
# .nojekyll keeps Pages from touching the files.
#
# Third-party actions are pinned to a commit SHA (the comment names the tag).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to write the Pages deployment; nothing else does.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # `soon` = the holding page, `site` = the whole site. See the header.
  PUBLISH_DIR: site

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A missing file is a broken page in production: check the entry points
      # and every asset the HTML asks for before anything is published.
      - name: Check the pages and their assets
        run: |
          set -eu
          test -d "$PUBLISH_DIR" || { echo "no such folder: $PUBLISH_DIR"; exit 1; }
          if [ "$PUBLISH_DIR" = "site" ]; then
            pages="index.html en/index.html wallet/index.html en/wallet/index.html \
                   wallet/docs/index.html en/wallet/docs/index.html 404.html CNAME \
                   robots.txt sitemap.xml .nojekyll"
          else
            pages="index.html 404.html CNAME robots.txt .nojekyll"
          fi
          for f in $pages; do
            test -e "$PUBLISH_DIR/$f" || { echo "missing: $PUBLISH_DIR/$f"; exit 1; }
          done
          python3 - "$PUBLISH_DIR" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          missing = []
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              for ref in set(re.findall(r'(?:src|href)="((?!https?:|mailto:|#|data:)[^"]+)"', html)):
                  ref = ref.split("#")[0].split("?")[0]
                  if not ref: continue
                  target = (root if ref.startswith("/") else page.parent) / ref.lstrip("/")
                  if ref.endswith("/"): target = target / "index.html"
                  if not target.exists(): missing.append(f"{page}: {ref}")
          if missing:
              print("\n".join(sorted(missing))); sys.exit(1)
          print(f"{root}: every local reference resolves")
          PY

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.PUBLISH_DIR }}
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
